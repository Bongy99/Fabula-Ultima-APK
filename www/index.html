<script>
const D=[6,8,10,12],K='fu-app-v2';
const ST=[['lento','Lento','dex'],['confuso','Confuso','ins'],['furia','Furia','dex,ins'],['debole','Debole','mig'],['scosso','Scosso','wlp'],['avvelenato','Avvelenato','mig,wlp']];
const ATT=[['dex','Destrezza'],['ins','Intuito'],['mig','Vigore'],['wlp','Volontà']];
const EM=[['Ammirazione','Inferiorità'],['Lealtà','Sfiducia'],['Affetto','Odio']];
const SEC=['Identità e Legami','Iniziativa e Difese','Zaino ed Equip.','Attributi e Stati','PF · PM · PI','Classi e Livelli','Abilità'];
const LISTS={
 classi:{t:'Classi',a:{n:'',l:1,b:''},f:[['n','Classe','text'],['l','Livello classe','number'],['b','Benefici e abilità di classe','area']]},
 armi:{t:'Armi (mano principale / secondaria)',a:{n:'',pr:'',d:'',t:'',m:'',q:'',desc:''},f:[['n','Nome','text'],['pr','Precisione','text'],['d','Danno','text'],['t','Tipo di danno','text'],['m','Mani / Distanza','text'],['q','Qualità','text'],['desc','Descrizione ed effetti','area']]},
 inc:{t:'Abilità e incantesimi',a:{n:'',pm:'',bs:'',dur:'',d:''},f:[['n','Nome','text'],['pm','Costo PM','text'],['bs','Bersaglio','text'],['dur','Durata','text'],['d','Effetto','area']]},
 zaino:{t:'Zaino',a:{n:'',c:'',q:''},f:[['n','Oggetto','text'],['c','Costo PI','text'],['q','Note','text']]}
};
const def=()=>({c:{nome:'',pron:'',ident:'',tema:'',orig:'',liv:5,px:0,fp:3,zenit:0,
 a:{dex:{b:8,c:8},ins:{b:8,c:8},mig:{b:8,c:8},wlp:{b:8,c:8}},pf:{c:0,m:0},pm:{c:0,m:0},pi:{c:6,m:6},ini:0,dif:0,mdif:0,
 st:{},bonds:Array.from({length:6},()=>({n:'',e:[0,0,0]})),classi:[],armi:[],inc:[],zaino:[],
 eq:{arm:'',m2:'',acc:'',acc2:''},note:'',obj:''},clocks:[]});
let S={chars:[],clocks:[],cur:null,c:null},tab='home',sec=0;
try{const j=JSON.parse(localStorage.getItem('fu-app-v3'));if(j&&j.chars)S=Object.assign(S,j);else{const o=JSON.parse(localStorage.getItem(K));if(o&&o.c){S.chars=[o.c];S.clocks=o.clocks||[]}}}catch(e){}
S.c=S.chars[S.cur]||null;
const save=()=>{try{localStorage.setItem('fu-app-v3',JSON.stringify({chars:S.chars,clocks:S.clocks,cur:S.cur}))}catch(e){}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const put=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
const I=(p,l,t='text')=>`<div><label>${l}</label><input type="${t}" data-p="${p}" value="${esc(get(p))}"></div>`;
const T=(p,l)=>`<div><label>${l}</label><textarea data-p="${p}">${esc(get(p))}</textarea></div>`;
const dieOpt=v=>D.map(d=>`<option value="${d}" ${d==v?'selected':''}>d${d}</option>`).join('');
const cd=k=>{const c=S.c;let n=0;ST.forEach(([s,,a])=>{if(c.st[s]&&a.split(',').includes(k))n++});return D[Math.max(0,D.indexOf(+c.a[k].b)-n)]};
const recompute=()=>ATT.forEach(([k])=>S.c.a[k].c=cd(k));
const sug=k=>{const c=S.c;return{pf:c.liv+5*c.a.mig.b,pm:c.liv+5*c.a.wlp.b,pi:6,dif:c.a.dex.c,mdif:c.a.ins.c}[k]};
function res(k,l){return `<div class="stat"><label>${l}</label><div class="cur"><input type="number" data-p="c.${k}.c" value="${S.c[k].c}"><b>/</b><input type="number" data-p="c.${k}.m" value="${S.c[k].m}"></div><div class="row" style="justify-content:center;margin-top:4px">${[-5,-1,1,5].map(d=>`<button class="o" data-act="adj" data-p="c.${k}.c" data-d="${d}">${d>0?'+':''}${d}</button>`).join('')}</div><div class="hint">attuale / massimo</div><div class="hint">suggerito: ${sug(k)} <a href="#" data-act="sug" data-k="${k}" data-t="m">usa</a></div>${k=='pf'?'<div class="crisi" id="cr"></div>':''}</div>`}
function one(k,l,hint){return `<div class="stat"><label>${l}</label><input type="number" data-p="c.${k}" value="${S.c[k]}" style="text-align:center;font-size:22px"><div class="hint">${hint||''} ${sug(k)!=null?`suggerito: ${sug(k)} <a href="#" data-act="sug" data-k="${k}">usa</a>`:''}</div></div>`}
function mkParser(){
 const cat={},sp={},H=[],AR=[],IN=[];let ar=null,ir=null,itb=false,gI='',cls=null,sk=null,mode=0,lastTitle=false,spC=null,spl=null,grp=0,tbl=false,pY=null,hr=null;
 const pg=x=>/^\d{1,3}$/.test(x)||/\s-\s\d{4,}$/.test(x),cl=d=>d.replace(/\(\s*r+\s*\)/g,'(⚔)').replace(/【\s+/g,'【').replace(/\s+】/g,'】').replace(/\.\s*\d{1,3}$/,'.').trim();
 const cap=s=>s.toLowerCase().replace(/(^|[\s’'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
 const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ú]/.test(s);
 return{
  page(items){
   const big=items.filter(t=>t.h>12.6&&/^[A-ZÀ-Ú’' ]{2,}$/.test(t.str.trim())).sort((a,b)=>b.y-a.y||a.x-b.x).map(t=>t.str.trim()).join(' ');
   if(big){mode=0;let m;
    if(m=big.match(/^INCANTESIMI DA (.+)$/)){spC=cap(m[1].replace(/^(LA|LO|IL|L’) /,''));if(spC!='Png'){mode=2;sp[spC]=sp[spC]||[];spl=null}}
    else if(/^ABILIT[ÀA] EROICHE$/.test(big)){mode=3;grp=0;tbl=false}
    else if(big=='GLI ARCANA'){mode=4;ar=null}
    else if(big=='TIPI DI TECNOLOGIA')mode=6}
   pY=null;
   const its=items.filter(t=>t.str.trim()&&t.h>=8.5&&t.h<=12.6).sort((a,b)=>b.y-a.y),lines=[];
   for(const t of its){const L=lines[lines.length-1];if(L&&Math.abs(L.y-t.y)<=3)L.i.push(t);else lines.push({y:t.y,i:[t]})}
   for(const L of lines){
    L.i.sort((a,b)=>a.x-b.x);
    const txt=L.i.map(t=>t.str.trim()).join(' ').replace(/\s+/g,' ').trim();
    const am=txt.match(/^ABILIT[ÀA]\s+(?:DELL[’']\s*|DELLA\s+|DELLO\s+|DEL\s+|DEI\s+|DEGLI\s+)([A-ZÀ-Ú’' ]+)$/);
    if(am){cls=cap(am[1].trim());cat[cls]=cat[cls]||[];mode=1;sk=null;lastTitle=false;continue}
    if(mode==1&&/^(ANCHE\s*:|BENEFICI\s+GRATUITI|INCANTESIMI\s+DA|CAPITOLO\s+\d)/i.test(txt)){mode=0;continue}
    if(mode==4){
     if(/^c\s/.test(txt)||pg(txt))continue;
     if(/^ARCANUM\s+(?:DEL|DELLA|DELLO|DELL’|DEI|DEGLI)\s*\S/.test(txt)){ar={n:cap(txt).replace(/ (Del|Della|Dello|Dei|Degli)\b/g,m=>m.toLowerCase()),r:'',d:''};AR.push(ar);continue}
     if(!ar)continue;
     if(/^Domini\s*:/.test(txt)){ar.r=txt.replace(/^Domini\s*:\s*/,'');continue}
     ar.d+=(ar.d?' ':'')+txt;continue}
    if(mode==6){if(txt=='INFUSIONI'){mode=5;itb=false;pY=null}continue}
    if(mode==5){
     if(/^INFUSIONE\s+EFFETTO/.test(txt)){itb=true;continue}
     if(itb&&/^[A-ZÀ-Ú’' ]{5,}$/.test(txt)){mode=0;continue}
     if(!itb||pg(txt))continue;
     const gm=txt.match(/^Infusioni\s+(\S+)$/);
     if(gm&&L.i.every(t=>t.x<100)){gI=gm[1];pY=null;continue}
     if(pY==null||pY-L.y>=14){ir={n:'',r:gI,d:''};IN.push(ir)}
     pY=L.y;
     for(const t of L.i){const f=t.x<100?'n':'d';ir[f]+=(ir[f]?' ':'')+t.str.trim()}
     continue}
    if(mode==2){
     if(/^INCANTESIMO\s+PM/i.test(txt)||pg(txt)||txt.length<2)continue;
     const ic=L.i.some(t=>/^r{1,2}$/.test(t.str.trim())),it=L.i.filter(t=>!/^r{1,2}$/.test(t.str.trim()));
     let g=0;for(let k=1;k<it.length;k++)if(it[k].x-(it[k-1].x+(it[k-1].w||0))>=15)g++;
     const pm=it.find(t=>t.x>=120&&t.x<180&&/\d/.test(t.str.trim()));
     if(it.length>=3&&it[0].x<90&&pm&&g>=2){const c=(a,b)=>it.filter(t=>t.x>=a&&t.x<b&&!(a>=285&&/^\d{1,3}$/.test(t.str.trim()))).map(t=>t.str.trim()).join(' ');
      spl={n:c(0,120),pm:c(120,180),bs:c(180,285),dur:c(285,999),o:ic?1:0,d:''};sp[spC].push(spl)}
     else if(spl)spl.d+=(spl.d?' ':'')+txt;
     continue}
    if(mode==3){
     if(/^LISTA DI ABILIT/i.test(txt)){tbl=true;continue}
     if(tbl&&/^[A-ZÀ-Ú’' ]{5,}$/.test(txt)){mode=0;continue}
     if(!tbl||pg(txt))continue;
     if(/^Abilit[àa] [Ee]roiche\b/.test(txt)){grp=/padronanza/i.test(txt)?2:1;pY=null;continue}
     if(!grp)continue;
     if(pY==null||pY-L.y>=14){hr={n:'',r:'',d:''};H.push(hr)}
     pY=L.y;
     for(const t of L.i){const f=t.x<128?'n':(grp==2&&t.x<225)?'r':'d';hr[f]+=(hr[f]?' ':'')+t.str.trim()}
     continue}
    const hd=L.i.filter(t=>t.h>11.8&&up(t.str.trim())),ti=L.i.filter(t=>t.h>10.5&&t.h<=11.8&&up(t.str.trim()));
    if(hd.length){
     const h=hd.map(t=>t.str.trim()).join(' '),m=h.match(/^ABILIT[ÀA]\s+(?:DELL[’']\s*|DELLA\s+|DELLO\s+|DEL\s+|DEI\s+|DEGLI\s+)(.+)$/);
     if(m){cls=cap(m[1]);cat[cls]=cat[cls]||[];mode=1;sk=null}else mode=0;
     continue}
    if(mode!=1)continue;
    if(ti.length){
     const name=ti.map(t=>t.str.trim()).join(' '),rest=L.i.filter(t=>!ti.includes(t)).map(t=>t.str).join('');
     const mx=rest.match(/(\d{1,2})/);
     if(sk&&!sk.d&&lastTitle){sk.n+=' '+name;if(mx)sk.max=+mx[1]}
     else{sk={n:name,max:mx?+mx[1]:1,d:''};cat[cls].push(sk)}
     lastTitle=true;continue}
    lastTitle=false;
    if(!sk||txt.length<2||/^\d{1,3}$/.test(txt)||/\s-\s\d{4,}$/.test(txt))continue;
    sk.d+=(sk.d?' ':'')+txt}
  },
  result(){for(const k in cat)cat[k].forEach(s=>{s.n=cap(s.n).replace(/\./g,'');s.d=cl(s.d)});return cat},
  extra(){const o={};for(const k in sp)if(sp[k].length)o[k]=sp[k].map(x=>({...x,d:cl(x.d)}));return{spells:o,heroic:H.filter(h=>h.n).map(h=>({n:h.n,r:h.r,d:cl(h.d)})),arcana:AR.map(h=>({...h,d:cl(h.d)})),infusioni:IN.filter(h=>h.n).map(h=>({...h,d:cl(h.d)}))}}}}

const CK='fu-cat-v1';let CAT={};try{CAT=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
let CAT2={};try{CAT2=JSON.parse(localStorage.getItem('fu-cat2-v1'))||{}}catch(e){}
let spSel='';
const spFind=n=>{for(const k in(CAT2.spells||{})){const s=CAT2.spells[k].find(x=>x.n.toLowerCase()==String(n||'').trim().toLowerCase());if(s)return s}return null};
const hFind=n=>(CAT2.heroic||[]).find(x=>x.n.toLowerCase()==String(n||'').trim().toLowerCase());
function spCard(){const sp=CAT2.spells||{},ks=Object.keys(sp);
 if(!ks.length)return `<div class="card"><h2>Dal manuale</h2><p class="mut">Nessun incantesimo o abilità eroica nel catalogo. In <b>Classi e Livelli</b> importa (o reimporta) il PDF del manuale per aggiungerli.</p></div>`;
 if(!sp[spSel])spSel=ks[0];const own=new Set(S.c.inc.map(x=>x.n.toLowerCase()));
 return `<div class="card"><h2>Incantesimi dal manuale</h2><select id="spc">${ks.map(k=>`<option ${k==spSel?'selected':''}>${esc(k)}</option>`).join('')}</select>${sp[spSel].map((s,j)=>{const o=own.has(s.n.toLowerCase());return `<div class="mw"><div class="row"><b class="wn" style="flex:1">${esc(s.n)}${s.o?' ⚔':''}</b><button class="${o?'o':''}" data-act="addsp" data-i="${j}" ${o?'disabled':''}>${o?'✓ Aggiunto':'+ Aggiungi'}</button></div><div class="hint">PM ${esc(s.pm)} · ${esc(s.bs)} · ${esc(s.dur)}</div><details><summary class="mut">Descrizione</summary><p>${nl(s.d)}</p></details></div>`}).join('')}</div>`}
function hCard(){const H=CAT2.heroic||[];if(!H.length)return'';const c=S.c;c.eroiche=c.eroiche||[];const own=new Set(c.eroiche.map(x=>x.toLowerCase()));
 return `<div class="card"><h2>Abilità eroiche</h2>${H.map((h,j)=>{const o=own.has(h.n.toLowerCase());return `<div class="mw"><div class="row"><b class="wn" style="flex:1">${esc(h.n)}</b><button class="${o?'o':''}" data-act="${o?'delh':'addh'}" data-i="${j}">${o?'✓ Rimuovi':'+ Aggiungi'}</button></div>${h.r?`<div class="hint">Requisiti: ${esc(h.r)}</div>`:''}<p>${nl(h.d)}</p></div>`}).join('')}</div>`}
function xCard(k,t,lab){const H=CAT2[k]||[];if(!H.length)return'';const c=S.c;c.sel=c.sel||{};const own=new Set((c.sel[k]||[]).map(x=>x.toLowerCase()));
 return `<div class="card"><h2>${t}</h2>${H.map((h,j)=>{const o=own.has(h.n.toLowerCase());return `<div class="mw"><div class="row"><b class="wn" style="flex:1">${esc(h.n)}</b><button class="${o?'o':''}" data-act="${o?'delx':'addx'}" data-k="${k}" data-i="${j}">${o?'✓ Rimuovi':'+ Aggiungi'}</button></div>${h.r?`<div class="hint">${lab}: ${esc(h.r)}</div>`:''}<details><summary class="mut">Descrizione</summary><p>${nl(h.d)}</p></details></div>`}).join('')}</div>`}
async function importPdf(f){
 if(typeof pdfjsLib==='undefined'){alert('Il lettore PDF è disponibile solo nell\'app installata (APK o WebApp), non in questa anteprima.');return}
 const st=document.getElementById('imps');
 try{pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,P=mkParser();
  for(let n=1;n<=pdf.numPages;n++){if(st)st.textContent='Lettura pagina '+n+' di '+pdf.numPages+'…';
   const tc=await(await pdf.getPage(n)).getTextContent();
   P.page(tc.items.filter(t=>t.str!==undefined&&t.transform).map(t=>({str:t.str,x:t.transform[4],y:t.transform[5],h:Math.hypot(t.transform[2],t.transform[3]),w:t.width||0})))}
  const r=P.result(),x=P.extra(),nsp=Object.values(x.spells).reduce((a,l)=>a+l.length,0),nc=Object.keys(r).filter(k=>r[k].length).length,ns=Object.values(r).reduce((a,l)=>a+l.length,0);
  if(!nc&&!nsp&&!x.heroic.length){alert('Nessuna classe trovata. Controlla che sia un manuale di Fabula Ultima nel formato originale.');render();return}
  if(nc){Object.assign(CAT,r);localStorage.setItem(CK,JSON.stringify(CAT))}

function arc(i,n){const p=a=>[100+90*Math.cos(a),100+90*Math.sin(a)],a0=-Math.PI/2+2*Math.PI*i/n,a1=-Math.PI/2+2*Math.PI*(i+1)/n,[x,y]=p(a0),[u,v]=p(a1);return `M100 100L${x} ${y}A90 90 0 0 1 ${u} ${v}Z`}

 <details><summary>Etichette degli spicchi</summary>${k.lab.map((l,j)=>`<div class="row" style="margin-top:4px"><b>${j+1}</b><input type="text" data-p="clocks.${i}.lab.${j}" value="${esc(l)}" placeholder="Descrizione sezione ${j+1}" style="flex:1"></div>`).join('')}</details>
 <div class="row" style="margin-top:8px"><button class="o" data-act="cfill" data-i="${i}" data-d="1">Avanza</button><button class="o" data-act="cfill" data-i="${i}" data-d="-1">Arretra</button><button class="x" data-act="cdel" data-i="${i}">Elimina</button></div></div>`}).join('')+`</div>`}

 const arm=c.armi.filter(w=>w.n||w.desc),ab=c.inc.filter(w=>w.n||w.d),cl=c.classi.filter(w=>w.n);
 return `<div class="card ms"><div class="mn">${esc(c.nome||'Senza nome')}</div><div>${esc(c.pron)}</div><div class="mut">${esc([c.ident,c.tema,c.orig].filter(Boolean).join(' · '))}</div>

 <h3>Armi</h3>${arm.map(w=>`<div class="mw"><b class="wn">${esc(w.n)}</b> ${w.pr?'【'+esc(w.pr)+'】 ':''}${w.d?'【'+esc(w.d)+'】 ':''}${esc([w.t,w.m].filter(Boolean).join(', '))}${w.q?`<div><i>${esc(w.q)}</i></div>`:''}${w.desc?`<p>${nl(w.desc)}</p>`:''}</div>`).join('')||'<p class="mut">Nessuna arma.</p>'}
 ${(()=>{const o=[];c.classi.forEach(x=>{const L=catOf(x.n);if(L&&x.sk)L.forEach(s=>{if(x.sk[s.n]>0)o.push([x.n,s,x.sk[s.n]])})});return o.length?'<h3>Abilità di classe</h3>'+o.map(([n,s,v])=>`<div class="mw"><b class="wn">${esc(s.n)}</b> (${esc(n)}) · LA ${v}/${s.max}<p>${nl(s.d)}</p></div>`).join(''):''})()}${(S.c.eroiche||[]).length?'<h3>Abilità eroiche</h3>'+S.c.eroiche.map(n=>{const h=hFind(n)||{};return `<div class="mw"><b class="wn">${esc(n)}</b>${h.r?' · '+esc(h.r):''}${h.d?`<p>${nl(h.d)}</p>`:''}</div>`}).join(''):''}${[['arcana','Arcana'],['infusioni','Infusioni']].map(([k,t])=>{const L=(S.c.sel||{})[k]||[];return L.length?`<h3>${t}</h3>`+L.map(n=>{const h=(CAT2[k]||[]).find(x=>x.n==n)||{};return `<div class="mw"><b class="wn">${esc(n)}</b>${h.r?' · '+esc(h.r):''}${h.d?`<p>${nl(h.d)}</p>`:''}</div>`}).join(''):''}).join('')}<h3>Abilità e incantesimi</h3>${ab.map(w=>`<div class="mw"><b class="wn">${esc(w.n)}</b> ${w.pm?'【'+esc(w.pm)+' PM】 ':''}${esc([w.bs,w.dur].filter(Boolean).join(' · '))}${(w.d||(spFind(w.n)||{}).d)?`<p>${nl(w.d||spFind(w.n).d)}</p>`:''}</div>`).join('')||'<p class="mut">Nessuna abilità.</p>'}

 const bk=document.getElementById('bk'),dump=()=>JSON.stringify({fu:1,chars:S.chars,clocks:S.clocks});

 render()});
