 classi:{t:'Classi',a:{n:'',l:1,b:''},f:[['n','Classe','text'],['l','Livello classe','number'],['b','Benefici e abilità di classe','area']]},

function res(k,l){return `<div class="stat"><label>${l}</label><div class="cur"><input type="number" data-p="c.${k}.c" value="${S.c[k].c}"><b>/</b><input type="number" data-p="c.${k}.m" value="${S.c[k].m}"></div><div class="row" style="justify-content:center;margin-top:4px">${[-5,-1,1,5].map(d=>`<button class="o" data-act="adj" data-p="c.${k}.c" data-d="${d}">${d>0?'+':''}${d}</button>`).join('')}</div><div class="hint">attuale / massimo</div><div class="hint">suggerito: ${sug(k)} <a href="#" data-act="sug" data-k="${k}" data-t="m">usa</a></div>${k=='pf'?'<div class="crisi" id="cr"></div>':''}</div>`}

function mkParser(){
 const cat={},sp={},H=[],HD=[],AR=[],IN=[],LS={};
 let magOn=false,ar=null,ir=null,itb=false,gI='',cls=null,sk=null,mode=0,lastTitle=false,spC=null,spl=null,grp=0,tbl=false,pY=null,hr=null,hdet=false,hent=null,hpy=null,hreq=false,hlt=false,lcur=null,lmg=null,mgi=null;

 const titleIt=s=>s.toLowerCase().split(/\s+/).map((w,k)=>{let m=w.match(/^(d|l|dell|all|nell|sull|un)['’](.+)$/);if(m)return m[1]+'’'+m[2][0].toUpperCase()+m[2].slice(1);if(k>0&&SMALL.test(w))return w;return w.replace(/^(\p{L})/u,x=>x.toUpperCase())}).join(' ');
 const nk=s=>s.toLowerCase().replace(/[^a-zà-ú0-9]/g,'');
 const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ú]/.test(s);
 const T=t=>t.str.trim();
 const lineTxt=L=>L.i.map((t,k)=>{let s=T(t);return(k==0&&s=='w')?'•':s}).filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
 const TH={'DANZA':['f1','danze','Danze (Danzatore)','Durata'],'SIMBOLO':['f1','simboli','Simboli (Simbolista)',''],'TONO':['f1','versi_toni','Toni dei versi (Cantore)',''],
  'DONO':['f1','doni','Doni (Esper)','Evento'],'TERIOFORMA':['f1','terioforme','Terioforme (Mutante)','Suggerimenti per Genoclepsi'],
  'ATTIVITÀ DA CAMPO':['f1','attivita','Attività da campo','Bersaglio'],'VOLUME':['f4','versi_volumi','Volumi dei versi (Cantore)',''],'CHIAVE':['f4','versi_chiavi','Chiavi dei versi (Cantore)',''],
  'SORGENTI E INVOCAZIONI':['f3','invocazioni','Invocazioni (Invocatore)','Sorgente']};
 const BIG=[[/^VERSI$/,7],[/^DANZE$/,7],[/^SIMBOLI$/,7],[/^DONI$/,7],[/^TERIOFORME$/,7],[/^ATTIVIT[ÀA] DA CAMPO$/,7],[/^SORGENTI E INVOCAZIONI$/,7],[/^MAGISEMI$/,8]];
 const getL=c=>LS[c[1]]||(LS[c[1]]={t:c[2],lab:c[3],items:[],cur:null,grp:''});
 const pmargin=(lines,fb)=>{const c={};lines.forEach(L=>{const f=L.i[0],n=L.i.reduce((a,t)=>a+T(t).length,0);if(n>=30&&f.x>=40&&f.x<130){const k=Math.round(f.x);c[k]=(c[k]||0)+1}});let b=null,bn=0;for(const k in c)if(c[k]>bn){bn=c[k];b=+k}return b==null?fb:b};
 function addBody(it,L,prevY){const s=lineTxt(L);if(!s)return;const brk=prevY!=null&&prevY-L.y>16||/^•/.test(s);it.d+=(it.d?(brk?'\n':' '):'')+s}
 function f1(seg,mg,L0,topY){
  const left=[],right=[];
  for(const L of seg){const f=L.i[0],s=lineTxt(L);if(!s||pg(s)||(f.str.trim()=='c'&&L.i.length>1&&f.x<mg+30))continue;(f.x>=mg+60?right:left).push(L)}
  const hd=new Set();
  left.forEach((L,k)=>{const f=L.i[0],n=L.i[1],pv=k>0?left[k-1].y:(topY!=null?topY:null),gap=pv==null?99:pv-L.y;
   const lone=!n||(n.x-(f.x+(f.w||0))>=10);
   if(f.b&&lone&&gap>=15&&f.x<mg+30)hd.add(L)});
  const metas=new Map();
  hd.forEach(L=>metas.set(L,L.i.slice(1).map(T).filter(Boolean).length?[{y:L.y,s:L.i.slice(1).map(T).filter(Boolean).join(' ')}]:[]));
  for(const R of right){let best=null,bd=9.5;hd.forEach(L=>{const d=Math.abs(L.y-R.y);if(d<bd){bd=d;best=L}});if(best)metas.get(best).push({y:R.y,s:lineTxt(R)})}
  let py=null;

   if(hd.has(L)){const m=metas.get(L).sort((a,b)=>b.y-a.y).map(x=>x.s).join(' ');L0.cur={n:T(L.i[0]),r:m,d:''};L0.items.push(L0.cur);py=L.y;continue}
   if(L0.cur){addBody(L0.cur,L,py);py=L.y}}
 }
 function f3(seg,mg,L0){
  const names=[],descs=[];
  for(const L of seg){const f=L.i[0],s=lineTxt(L);if(!s||pg(s))continue;
   if(f.x<mg+30){const gm=s.match(/^(Sorgente\s.+)$/);if(gm&&f.b&&L.i.length==1){L0.grp=gm[1];continue}
    if(f.b){names.push({y:L.y,n:T(f),g:L0.grp});const rest=L.i.filter(t=>t.x>=mg+55);if(rest.length)descs.push({y:L.y,s:rest.map(T).join(' '),g:L0.grp});continue}}
   const rest=L.i.filter(t=>t.x>=mg+55);if(rest.length)descs.push({y:L.y,s:rest.map(T).join(' '),g:L0.grp})}

  for(const d of descs){let b=null,bd=1e9;bucket.forEach(n=>{if(n.g!=d.g)return;const x=Math.abs(n.y-d.y);if(x<bd){bd=x;b=n}});if(b)b.ds.push(d)}
  bucket.forEach(b=>{b.ds.sort((a,c)=>c.y-a.y);L0.items.push({n:b.n,r:b.g.replace(/^Sorgente\s+/,'Sorgente: ').replace(/\s*\(tipo di danno:\s*/,' · danno ').replace(/\)$/,''),d:b.ds.map(x=>x.s).join(' ')})})
 }
 function f4rows(rows,hdr,L0){
  const cols=hdr.i.map(t=>({n:T(t),x:t.x}));
  for(const L of rows){const cells=cols.map(()=>[]);
   L.i.forEach((t,k)=>{let b=0;for(let j=0;j<cols.length;j++)if(cols[j].x<=t.x+6)b=j;if(k==0)b=0;cells[b].push(T(t))});
   L0.items.push({n:cells[0].join(' '),r:'',d:cells.map((c,j)=>j&&c.length?(cols[j].n.length<=3?cols[j].n:cols[j].n.charAt(0)+cols[j].n.slice(1).toLowerCase())+': '+c.join(' '):'').filter(Boolean).join(' · ')})}
 }
  function listPage(lines){
  let mg=pmargin(lines,null),topY=null,seg=[],cur=lcur,hdrLine=null;
  const flush=()=>{if(!cur||!seg.length){seg=[];return}const C=cur,m=(hdrLine?hdrLine.i[0].x:null)??mg??57;
   if(C.f=='f1')f1(seg,m,C.L,topY);else if(C.f=='f3')f3(seg,m,C.L);seg=[]};
  for(const L of lines){
   const f=L.i[0],t0=T(f).toUpperCase(),s=lineTxt(L);
   const h12=L.i.some(t=>t.h>11.8&&up(T(t))&&T(t).length>3);
   if(h12){flush();cur=null;continue}
   const th=!f.b&&f.h<=10.6&&up(T(f))&&TH[t0];
   if(th&&L.i.every(t=>up(T(t))&&!t.b)){flush();const cfg=th;cur={f:cfg[0],L:getL(cfg)};hdrLine=L;topY=L.y;
    if(cfg[0]=='f4'){const ix=lines.indexOf(L),rows=[];let k=ix+1;
     for(;k<lines.length;k++){const R=lines[k],ss=lineTxt(R);if(!ss||pg(ss))continue;if(R.i.length<L.i.length||Math.abs(R.i[0].x-L.i[0].x)>8||R.i.every(t=>up(T(t))&&!t.b))break;rows.push(R)}
     f4rows(rows,L,cur.L);rows.forEach(R=>R.__f4=true);cur=null}
    continue}
   if(L.__f4)continue;
   if(cur)seg.push(L)}
  flush();lcur=cur}
 function finMag(){
  if(!mgi)return;const L0=LS.magisemi||(LS.magisemi={t:'Magisemi (Floralista)',lab:'',items:[]}),it=mgi,rows=it.rows.slice().sort((a,b)=>b.y-a.y);
  const bl=rows.map(r=>({l:r.l,ds:[]}));
  for(const x of it.tx){let b=null,bd=1e9;rows.forEach((r,q)=>{const d=Math.abs(r.y-x.y);if(d<bd){bd=d;b=bl[q]}});if(b)b.ds.push(x)}
  L0.items.push({n:cap(it.n),r:'',d:[it.fl.join(' ')].concat(bl.map(b=>'Sezioni '+b.l+': '+b.ds.sort((a,c)=>c.y-a.y).map(x=>x.s).join(' '))).filter(x=>x&&!/: $/.test(x)).join('\n')});mgi=null}
 function magPage(lines){
  const ti=L=>L.i.length==1&&L.i[0].h>11.8&&L.i[0].h<=12.6&&up(T(L.i[0]))&&T(L.i[0]).length>3&&!/^LISTA\b/.test(T(L.i[0]));
  for(const L of lines){
   const s=lineTxt(L);if(!s||L.y<48)continue;
   if(/^LISTA\b/.test(s)){finMag();magOn=true;continue}
   if(ti(L)){finMag();if(!magOn)continue;mgi={n:T(L.i[0]),fl:[],tx:[],rows:[],ex:null,seen:false};continue}

   if(L.i.every(t=>/^(T|EFFETTO)$/.test(T(t)))){const e=L.i.find(t=>T(t)=='EFFETTO');if(e){mgi.ex=e.x;mgi.seen=true}continue}
   if(!mgi.seen){mgi.fl.push(s);continue}
   const toks=[];for(const t of L.i){if(t.b&&/^\d(-\d)?$/.test(T(t))&&t.x<mgi.ex-8)mgi.rows.push({l:T(t),y:L.y});else toks.push(t)}

 }
 return{
  page(items){
   const big=items.filter(t=>t.h>12.6&&/^[A-ZÀ-Ú’' ]{2,}$/.test(t.str.trim())).sort((a,b)=>b.y-a.y||a.x-b.x).map(t=>t.str.trim()).join(' ');
   if(big){mode=0;let m;lcur=null;hdet=false;
    if(m=big.match(/^INCANTESIMI DA (.+)$/)){spC=cap(m[1].replace(/^(LA|LO|IL|L’) /,''));if(spC!='Png'){mode=2;sp[spC]=sp[spC]||[];spl=null}}
    else if(/^(NUOVE )?ABILIT[ÀA] EROICHE\b/.test(big)){mode=3;grp=0;tbl=false;hdet=false;hent=null}

function arc(i,n){const p=a=>[100+90*Math.cos(a),100+90*Math.sin(a)],a0=-Math.PI/2+2*Math.PI*i/n,a1=-Math.PI/2+2*Math.PI*(i+1)/n,[x,y]=p(a0),[u,v]=p(a1);return `M100 100L${x} ${y}A90 90 0 0 1 ${u} ${v}Z`}
function clocks(){return `<div class="card"><div class="row"><button data-act="newclock">+ Nuovo clock</button><span class="mut">Tocca uno spicchio per riempire fino a lì; toccalo di nuovo per svuotarlo. I clock sono condivisi da tutti i personaggi.</span></div></div><div class="clocks">`+S.clocks.map((k,i)=>{
 let sv='';for(let j=0;j<k.n;j++){const a=-Math.PI/2+2*Math.PI*(j+.5)/k.n;sv+=`<path d="${arc(j,k.n)}" fill="${j<k.filled?k.col:'var(--empty)'}" stroke="var(--ink)" stroke-width="2" data-act="seg" data-i="${i}" data-j="${j}"/><text x="${100+60*Math.cos(a)}" y="${100+60*Math.sin(a)+4}" text-anchor="middle" font-size="11" fill="var(--ink)" pointer-events="none">${j+1}</text>`}
 return `<div class="card">${I(`clocks.${i}.name`,'Nome del clock')}<svg class="cl" viewBox="0 0 200 200">${sv}</svg><div style="text-align:center"><b>${k.filled}/${k.n}</b>${k.filled>=k.n?' <span class="crisi">Completo!</span>':''}</div>
 <div class="row" style="margin:8px 0"><div><label>Sezioni</label><div class="row"><button class="o" data-act="csec" data-i="${i}" data-d="-1">−</button><b>${k.n}</b><button class="o" data-act="csec" data-i="${i}" data-d="1">+</button></div></div><div><label>Colore</label><input type="color" data-p="clocks.${i}.col" value="${k.col}"></div></div>
 <details><summary>Etichette degli spicchi</summary>${k.lab.map((l,j)=>`<div class="row" style="margin-top:4px"><b>${j+1}</b><input type="text" data-p="clocks.${i}.lab.${j}" value="${esc(l)}" placeholder="Descrizione sezione ${j+1}" style="flex:1"></div>`).join('')}</details>
 <div class="row" style="margin-top:8px"><button class="o" data-act="cfill" data-i="${i}" data-d="1">Avanza</button><button class="o" data-act="cfill" data-i="${i}" data-d="-1">Arretra</button><button class="x" data-act="cdel" data-i="${i}">Elimina</button></div></div>`}).join('')+`</div>`}
const AB={dex:'DES',ins:'INT',mig:'VIG',wlp:'VOL'},nl=x=>esc(x).replace(/\n/g,'<br>');

function riep(){const c=S.c,box=(l,v,i)=>`<div class="mb"><span>${l}</span><b>${v}</b>${i?`<i>${i}</i>`:''}</div>`,st=ST.filter(([k])=>c.st[k]).map(x=>x[1]);
 const arm=c.armi.filter(w=>w.n||w.desc),ab=c.inc.filter(w=>w.n||w.d),cl=c.classi.filter(w=>w.n);
 return `<div class="card ms"><div class="mn">${esc(c.nome||'Senza nome')}</div><div>${esc(c.pron)}</div><div class="mut">${esc([c.ident,c.tema,c.orig].filter(Boolean).join(' · '))}</div>
 <div style="margin-top:4px">Livello <b>${c.liv}</b>${cl.length?' · '+cl.map(x=>esc(x.n)+' '+x.l).join(', '):''}</div>
 <h3>Punti</h3><div class="mg">${rbox('pf','Punti Ferita')}${rbox('pm','Punti Mente')}${rbox('pi','Punti Inventario')}${box('Punti Fabula',c.fp)}${box('Zenit',c.zenit)}</div>
 <h3>Attributi</h3><div class="mg">${ATT.map(([k,n])=>abox(k,n)).join('')}</div>
 ${st.length?`<p><b>Stati:</b> ${st.join(', ')}</p>`:''}
 <h3>Difese</h3><div class="mg">${box('Difesa',c.dif)}${box('Difesa Magica',c.mdif)}${box('Iniziativa',c.ini>0?'+'+c.ini:c.ini)}</div>
 <h3>Armi</h3>${arm.map(w=>`<div class="mw"><b class="wn">${esc(w.n)}</b> ${w.pr?'【'+esc(w.pr)+'】 ':''}${w.d?'【'+esc(w.d)+'】 ':''}${esc([w.t,w.m].filter(Boolean).join(', '))}${w.q?`<div><i>${esc(w.q)}</i></div>`:''}${w.desc?`<p>${nl(w.desc)}</p>`:''}</div>`).join('')||'<p class="mut">Nessuna arma.</p>'}
 ${(()=>{const o=[];c.classi.forEach(x=>{const L=catOf(x.n);if(L&&x.sk)L.forEach(s=>{if(x.sk[s.n]>0)o.push([x.n,s,x.sk[s.n]])})});return o.length?'<h3>Abilità di classe</h3>'+o.map(([n,s,v])=>`<div class="mw"><b class="wn">${esc(s.n)}</b> (${esc(n)}) · LA ${v}/${s.max}<p>${nl(s.d)}</p></div>`).join(''):''})()}${(S.c.eroiche||[]).length?'<h3>Abilità eroiche</h3>'+S.c.eroiche.map(n=>{const h=hFind(n)||{};return `<div class="mw"><b class="wn">${esc(n)}</b>${h.r?' · '+esc(h.r):''}${h.d?`<p>${nl(h.d)}</p>`:''}</div>`}).join(''):''}${Object.keys(S.c.sel||{}).map(k=>{const L=S.c.sel[k]||[],t=selT(k);return L.length?`<h3>${t}</h3>`+L.map(n=>{const h=xs(k).find(x=>x.n==n)||{};return `<div class="mw"><b class="wn">${esc(n)}</b>${h.r?' · '+esc(h.r):''}${h.d?`<p>${nl(h.d)}</p>`:''}</div>`}).join(''):''}).join('')}<h3>Abilità e incantesimi</h3>${ab.map(w=>`<div class="mw"><b class="wn">${esc(w.n)}</b> ${w.pm?'【'+esc(w.pm)+' PM】 ':''}${esc([w.bs,w.dur].filter(Boolean).join(' · '))}${(w.d||(spFind(w.n)||{}).d)?`<p>${nl(w.d||spFind(w.n).d)}</p>`:''}</div>`).join('')||'<p class="mut">Nessuna abilità.</p>'}
 ${cl.some(x=>x.b)?'<h3>Benefici di classe</h3>'+cl.filter(x=>x.b).map(x=>`<div class="mw"><b class="wn">${esc(x.n)}</b> (liv. ${x.l})<p>${nl(x.b)}</p></div>`).join(''):''}</div>`}
function doImport(rep){const el=document.getElementById('bk');try{const j=JSON.parse(el.value.trim());if(j&&j.eq&&!j.chars){alert('Questo è un codice di equipaggiamento: importalo nella sezione “Equipaggiamento condiviso”.');return false}if(!j||!Array.isArray(j.chars))throw 0;
 const ch=j.chars.map(c=>Object.assign(JSON.parse(JSON.stringify(def().c)),c));
 if(rep){if(!confirm('Sostituire tutti i personaggi e i clock attuali?'))return false;S.chars=ch;S.clocks=j.clocks||[];S.cur=null;S.c=null}
 else{S.chars.push(...ch);S.clocks.push(...(j.clocks||[]))}
 alert('Importati '+ch.length+' personaggi');return true}catch(x){alert('Testo non valido: incolla il codice esportato dall\'app.');return false}}

let XN=new Set(),XL=0,XC=true,XI=false,EQC=0,EQS=new Set();
const EQL=[['armi','Armi'],['zaino','Zaino']];
function eqCard(){const n=S.chars.length;if(!n)return'';if(EQC>=n)EQC=0;const c=S.chars[EQC];
 const items=EQL.map(([k,t])=>(c[k]||[]).map((x,i)=>[k,t,i,x])).flat().filter(([k,t,i,x])=>x.n);
 return `<div class="card" style="margin-top:12px"><h2>Equipaggiamento condiviso</h2><p class="mut">Esporta solo alcuni oggetti personalizzati (per esempio quelli creati dal Master) per girarli a un altro giocatore. Chi riceve il codice li importa qui sotto e scelgono a quale personaggio aggiungerli.</p>
 <div class="row"><select id="eqc" style="flex:1">${S.chars.map((x,i)=>`<option value="${i}" ${i==EQC?'selected':''}>${esc(x.nome||'Senza nome')}</option>`).join('')}</select></div>
 ${items.length?items.map(([k,t,i,x])=>`<label class="pill" data-act="eqsel" data-k="${k}${i}" style="cursor:pointer"><input type="checkbox" ${EQS.has(k+i)?'checked':''} style="pointer-events:none"> <b>${esc(x.n)}</b> <span class="mut">${t}</span></label>`).join(''):'<p class="mut">Questo personaggio non ha armi o oggetti dello zaino con un nome.</p>'}
 <div class="row" style="margin-top:6px"><button data-act="eqexp">Esporta equipaggiamento scelto</button></div>
 <textarea id="eqbk" placeholder="Qui compare il codice dell’equipaggiamento. Per riceverlo, incollalo qui." style="margin-top:8px;min-height:80px"></textarea>
 <div class="row" style="margin-top:6px"><span class="mut">Aggiungi a:</span><select id="eqt" style="flex:1">${S.chars.map((x,i)=>`<option value="${i}">${esc(x.nome||'Senza nome')}</option>`).join('')}</select><button class="o" data-act="eqimp">Importa equipaggiamento</button></div></div>`}
function home(){const n=S.chars.length;if(XL!==n){XN.clear();EQS.clear();XL=n}return `<div class="card"><div class="row"><button data-act="new">+ Nuovo personaggio</button><span class="mut">${n} personagg${n==1?'io':'i'}</span></div></div><div class="clocks">`+S.chars.map((c,i)=>`<div class="card"><div data-act="open" data-i="${i}" style="cursor:pointer"><div class="big" style="font-size:20px">${esc(c.nome||'Senza nome')}</div><div class="mut">${esc([c.ident,c.tema,c.orig].filter(Boolean).join(' · '))||'—'}</div><p>Liv. <b>${c.liv}</b> · PF <b>${c.pf.c}/${c.pf.m}</b> · PM <b>${c.pm.c}/${c.pm.m}</b> · ⭐ <b>${c.fp}</b></p></div><div class="row"><button data-act="open" data-i="${i}">Apri</button><button class="o" data-act="dup" data-i="${i}">Duplica</button><button class="x" data-act="chdel" data-i="${i}">Elimina</button></div></div>`).join('')+`</div>`+(n?'':'<p class="mut">Nessun personaggio: creane uno per iniziare.</p>')+`<div class="card" style="margin-top:12px"><h2>Backup e trasferimento</h2><p class="mut">Scegli quali personaggi esportare, poi tocca Esporta: ottieni un codice da incollare su un altro dispositivo.</p>${S.chars.length?S.chars.map((c,i)=>`<label class="pill" data-act="xsel" data-i="${i}" style="cursor:pointer"><input type="checkbox" ${XN.has(i)?'':'checked'} style="pointer-events:none"> ${esc(c.nome||'Senza nome')}</label>`).join(''):'<p class="mut">Nessun personaggio.</p>'}<div class="row" style="margin-top:6px"><button class="o s" data-act="xall">Tutti</button><button class="o s" data-act="xnone">Nessuno</button><label class="pill" data-act="xclk" style="cursor:pointer"><input type="checkbox" ${XC?'checked':''} style="pointer-events:none"> includi i clock</label></div><div class="row" style="margin-top:6px"><button data-act="exp">Esporta selezionati</button><button class="o" data-act="copy">Copia</button></div><textarea id="bk" placeholder="Qui compare il codice esportato. Per importare, incollalo qui." style="margin-top:8px;min-height:90px"></textarea><div class="row" style="margin-top:6px"><button class="o" data-act="imp">Importa (aggiungi)</button><button class="x" data-act="impr">Importa (sostituisci tutto)</button></div></div>${eqCard()}`}
function render(){if((tab=='sheet'||tab=='riep')&&!S.c)tab='home';const A=document.getElementById('app');A.innerHTML=tab=='home'?home():tab=='sheet'?SECS[sec]():tab=='riep'?riep():clocks();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));
 document.getElementById('nav').innerHTML=tab=='sheet'?SEC.map((n,i)=>`<button class="tab ${i==sec?'on':''}" data-act="s" data-i="${i}">${i+1}. ${n}</button>`).join(''):'';
 document.getElementById('fpbar').style.display=S.c&&tab!='home'?'flex':'none';document.getElementById('fpbar').innerHTML=`<b>⭐ Punti Fabula · ${S.c?esc(S.c.nome||'Senza nome'):''}</b><button class="o" data-act="adj" data-p="c.fp" data-d="-1">−</button><input type="number" data-p="c.fp" value="${S.c?S.c.fp:0}"><button class="o" data-act="adj" data-p="c.fp" data-d="1">+</button>`;
 derive();save()}
function derive(){if(!S.c)return;const c=S.c,$=(i,v)=>{const e=document.getElementById(i);if(e)e.textContent=v};
 $('cv','Crisi: '+Math.floor(c.pf.m/2));$('cr',c.pf.m>0&&c.pf.c<=Math.floor(c.pf.m/2)?'⚠ IN CRISI':'');c.bonds.forEach((b,i)=>$('bf'+i,b.e.filter(x=>x).length))}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;
 put(p,t.type=='checkbox'?t.checked:(t.type=='number'||t.dataset.n!==undefined)?Number(t.value)||0:t.value);
 if(p=='c.fp'){document.querySelectorAll('input[data-p="c.fp"]').forEach(x=>{if(x!==t)x.value=t.value})}
 if(t.dataset.rc!==undefined){recompute();render();return}derive();save()});
document.addEventListener('change',e=>{if(e.target.id=='eqc'){EQC=+e.target.value;EQS.clear();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;e.preventDefault();const a=t.dataset.act,i=+t.dataset.i,d=+t.dataset.d,k=S.clocks[i];
 const bk=document.getElementById('bk'),dump=()=>{const sel=S.chars.filter((c,j)=>!XN.has(j));return JSON.stringify({fu:1,chars:sel,clocks:XC?S.clocks:[]})};
 if(a=='xsel'){XN.has(i)?XN.delete(i):XN.add(i);render();return}
 if(a=='xall'){XN.clear();render();return}
 if(a=='xnone'){S.chars.forEach((c,j)=>XN.add(j));render();return}
 if(a=='xclk'){XC=!XC;render();return}
 if(a=='eqsel'){const q=t.dataset.k;EQS.has(q)?EQS.delete(q):EQS.add(q);render();return}
 if(a=='eqexp'){const c=S.chars[EQC],o={};EQL.forEach(([k])=>{o[k]=(c[k]||[]).filter((x,j)=>EQS.has(k+j)).map(x=>JSON.parse(JSON.stringify(x)))});const n=o.armi.length+o.zaino.length;if(!n){alert('Seleziona almeno un oggetto.');return}
  const ta=document.getElementById('eqbk');ta.value=JSON.stringify({fu:1,eq:o});ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).catch(()=>{})}catch(x){}try{document.execCommand('copy')}catch(x){}alert(n+' oggetti esportati e copiati negli appunti.');return}
 if(a=='eqimp'){const ta=document.getElementById('eqbk');try{const j=JSON.parse(ta.value.trim());if(!j||!j.eq)throw 0;const c=S.chars[+document.getElementById('eqt').value];if(!c)throw 1;let n=0;EQL.forEach(([k])=>{(j.eq[k]||[]).forEach(x=>{if(x&&typeof x=='object'){(c[k]=c[k]||[]).push(Object.assign({},x));n++}})});alert('Aggiunti '+n+' oggetti a '+(c.nome||'Senza nome'));ta.value=''}catch(x){alert(x===1?'Crea prima un personaggio.':'Codice non valido: incolla il codice di equipaggiamento esportato dall\'app.');return}render();return}
 if(a=='exp'){bk.value=dump();bk.focus();bk.select();return}
 if(a=='copy'){if(!bk.value)bk.value=dump();bk.select();try{navigator.clipboard.writeText(bk.value).catch(()=>{})}catch(x){}try{document.execCommand('copy')}catch(x){}alert('Codice copiato');return}
 if(a=='imp'||a=='impr'){if(!doImport(a=='impr'))return}
 else if(a=='tab')tab=(t.dataset.v!='home'&&t.dataset.v!='clocks'&&!S.c)?'home':t.dataset.v;
 else if(a=='new'){S.chars.push(def().c);S.cur=S.chars.length-1;S.c=S.chars[S.cur];tab='sheet';sec=0}
 else if(a=='open'){S.cur=i;S.c=S.chars[i];tab='sheet';sec=0}
 else if(a=='dup'){const n=JSON.parse(JSON.stringify(S.chars[i]));n.nome=(n.nome||'Senza nome')+' (copia)';S.chars.push(n)}
 else if(a=='chdel'){if(!confirm('Eliminare questo personaggio?'))return;S.chars.splice(i,1);if(S.cur===i){S.cur=null;S.c=null}else if(S.cur>i)S.cur--}
 else if(a=='s'){sec=i;tab='sheet'}
 else if(a=='adj')put(t.dataset.p,(Number(get(t.dataset.p))||0)+d);
 else if(a=='sug'){const q=t.dataset.k;if(t.dataset.t)S.c[q].m=sug(q);else S.c[q]=sug(q)}
 else if(a=='add')S.c[t.dataset.k].push({...LISTS[t.dataset.k].a});
 else if(a=='del')S.c[t.dataset.k].splice(i,1);
 else if(a=='newclock')S.clocks.push({name:'Nuovo clock',n:6,filled:0,col:'#7a3e9d',lab:Array(6).fill('')});
 else if(a=='cdel'){if(confirm('Eliminare questo clock?'))S.clocks.splice(i,1);else return}
 else if(a=='seg'){const j=+t.dataset.j;k.filled=k.filled==j+1?j:j+1}
 else if(a=='cfill')k.filled=Math.min(k.n,Math.max(0,k.filled+d));
 else if(a=='csec'){k.n=Math.min(12,Math.max(2,k.n+d));while(k.lab.length<k.n)k.lab.push('');k.lab.length=k.n;k.filled=Math.min(k.filled,k.n)}
 else if(a=='addsp'){const s=CAT2.spells[spSel][i];S.c.inc.push({n:s.n,pm:s.pm,bs:s.bs,dur:s.dur,d:''})}
 else if(a=='addx'){const k=t.dataset.k;selOf(S.c,k).push(xs(k)[i].n)}
 else if(a=='delx'){const k=t.dataset.k,n=xs(k)[i].n,L=selOf(S.c,k),j=L.indexOf(n);if(j>=0)L.splice(j,1)}
 else if(a=='clrcat'){if(confirm('Cancellare il catalogo importato?')){CAT={};CAT2={};localStorage.removeItem(CK);localStorage.removeItem('fu-cat2-v1')}else return}
 else if(a=='reset'){if(confirm('Azzerare questa scheda?')){S.chars[S.cur]=def().c;S.c=S.chars[S.cur]}else return}
 render()});
