name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install

      - name: Crea progetto Android
        run: npx cap add android

      - name: Usa sempre la stessa firma e aumenta il numero di versione
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Genera icone e splash
        run: npx capacitor-assets generate --android

      - name: Sincronizza file web
        run: npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: fabula-ultima-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
